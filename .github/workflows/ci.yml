name: CI

# Full test suite on both platforms the product targets (Windows first), plus a
# packaging smoke that runs the SHIPPED tarball layout (catches CLI-path/style
# bugs that source-tree unit tests cannot).
on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm test
        # GitHub's Windows runner exposes an 8.3 short temp path (RUNNER~1) by
        # default; path-identity integration tests need the long runner temp path.
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}

  package-smoke:
    name: package smoke (npm pack -> extract -> CLI/CLI_PATH/non-TTY gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run verify:package
